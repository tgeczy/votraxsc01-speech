name = votraxsc01
summary = "Votrax SC-01 (emulated)"
description = """Speech synthesizer driver for the Votrax SC-01, the 1980 phoneme chip behind the Type 'N Talk, the Apple II Mockingboard's speech and a generation of arcade machines. The speech is not imitated -- it is MAME's silicon-level simulation of the decapped chip, its filters derived from the patent schematics. Both mask revisions (SC-01 and SC-01-A) appear as voices. Requires the chip's 512-byte internal ROM dump (sc01.bin / sc01a.bin, the standard MAME files); release bundles include it, and the loader verifies its checksum either way."""
author = "Tamas Geczy <gt1991@gmail.com>"
url = https://github.com/tgeczy/votraxsc01-nvda
version = 1.0.2
docFileName = readme.html
minimumNVDAVersion = 2023.1.0
lastTestedNVDAVersion = 2026.1.0
